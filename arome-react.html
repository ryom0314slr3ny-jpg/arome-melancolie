/* ===== 疑似環境音 ===== */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx=null, ambientNodes=null; const isMuted={v:false};
function ctx(){ try{ if(!actx&&AudioCtx) actx=new AudioCtx(); if(actx&&actx.state==="suspended") actx.resume(); }catch(e){} return actx; }
function playBell(){ const c=ctx(); if(!c||isMuted.v) return; const t=c.currentTime;
  [523.25,659.25,784.0,1046.5].forEach((f,i)=>{ const o=c.createOscillator(),g=c.createGain();
    o.type=i===0?"sine":"triangle"; o.frequency.value=f; g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.16/(i+1),t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+3.2+i*0.3);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+3.6+i*0.3); }); }
function playDoor(){ const c=ctx(); if(!c||isMuted.v) return; const t=c.currentTime,dur=1.8;
  const buf=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const src=c.createBufferSource(); src.buffer=buf; const f=c.createBiquadFilter(); f.type="lowpass";
  f.frequency.setValueAtTime(220,t); f.frequency.linearRampToValueAtTime(90,t+dur);
  const g=c.createGain(); g.gain.setValueAtTime(0.28,t); g.gain.linearRampToValueAtTime(0.001,t+dur);
  src.connect(f).connect(g).connect(c.destination); src.start(t); }
// 入店の音：ふわっと上昇するきらめき＋温かい低音（＝光の中へ）
function playEnter(){
  const c=ctx(); if(!c||isMuted.v) return; const t=c.currentTime;
  const notes=[523.25,659.25,783.99,1046.5,1318.5]; // C5 E5 G5 C6 E6
  notes.forEach((f,i)=>{
    const o=c.createOscillator(), g=c.createGain(), st=t+i*0.075;
    o.type="sine"; o.frequency.value=f;
    g.gain.setValueAtTime(0,st); g.gain.linearRampToValueAtTime(0.11/(1+i*0.15),st+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,st+1.5);
    o.connect(g).connect(c.destination); o.start(st); o.stop(st+1.7);
  });
  const o2=c.createOscillator(), g2=c.createGain();
  o2.type="sine"; o2.frequency.setValueAtTime(120,t); o2.frequency.exponentialRampToValueAtTime(72,t+1.3);
  g2.gain.setValueAtTime(0.0001,t); g2.gain.linearRampToValueAtTime(0.16,t+0.08); g2.gain.exponentialRampToValueAtTime(0.0001,t+1.5);
  o2.connect(g2).connect(c.destination); o2.start(t); o2.stop(t+1.7);
}
function startAmbient(){ const c=ctx(); if(!c||isMuted.v||ambientNodes) return;
  const buf=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*0.5;
  const src=c.createBufferSource(); src.buffer=buf; src.loop=true;
  const f=c.createBiquadFilter(); f.type="lowpass"; f.frequency.value=380;
  const g=c.createGain(); g.gain.value=0.015; src.connect(f).connect(g).connect(c.destination); src.start(); ambientNodes={src}; }
function stopAmbient(){ if(ambientNodes){ try{ambientNodes.src.stop();}catch(e){} ambientNodes=null; } }

        ${p.img?html`<img src=${p.img} alt=${p.fr} className="absolute inset-0 w-full h-full object-cover"
          onError=${(e)=>{e.currentTarget.style.display="none";}} />`:null}
      </div>
      <div>
        <p className="font-logo text-gold tracking-[.2em] text-xs mb-2">${p.fr}</p>
        <h2 className="font-title text-bordeaux" style=${{fontSize:"clamp(28px,4vw,44px)",fontWeight:500}}>${p.ja}</h2>
        <p className="font-body text-[#4a4238] my-6 text-[15px] leading-loose">${p.lead}</p>
        <div className="border-t border-gold/40">
          ${rows.map(r=>html`<div key=${r[0]} className="flex gap-4 py-3.5 border-b border-gold/25 text-sm">
            <span className="font-title text-gold w-24 shrink-0">${r[0]}</span>
            <span className="text-midnight">${r[1]}</span>
          </div>`)}
        </div>
        <p className="font-title text-bordeaux my-6" style=${{fontSize:30}}>${p.price}</p>
        <${GoldButton} solid onClick=${()=>alert("※ 購入機能は後で設定します（お支払い・在庫連携など）")}>購入する<//>
        <div className="mt-10"><button onClick=${back} className="font-title italic text-gold hover:text-bordeaux">‹ お菓子の一覧へ戻る</button></div>
      </div>
    </div>
  </section>`;
}
function Access(){
  const rows=[["店名","Pâtisserie Arômélancolie"],["住所","〒000-0000　○○県○○市○○ 0-0-0"],
    ["営業時間","21:00 〜 翌 3:00（夜にだけ現れる幻のパティスリー）"],["定休日","満月の夜"],["電話番号","000-0000-0000"]];
  return html`<section className="max-w-3xl mx-auto px-6 pt-20 pb-28">
    <${Head} fr="ACCÈS" title="Access" sub="夜にだけ、灯りをともします。" />
    <table className="w-full"><tbody>
      ${rows.map(r=>html`<tr key=${r[0]} className="border-b border-gold/30 align-top">
        <th className="text-left py-4 pr-4 font-title text-gold font-medium whitespace-nowrap w-36">${r[0]}</th>
        <td className="py-4 text-[15px] text-midnight">${r[1]}</td>
      </tr>`)}
    </tbody></table>
    <p className="text-xs text-[#7a6f5f] mt-6 text-center">※ 実際の店舗情報に差し替えてください</p>
  </section>`;
}
function Concept(){
  return html`<section className="max-w-2xl mx-auto px-6 pt-20 pb-28 text-center">
    <${Head} fr="NOTRE HISTOIRE" title="Arômélancolie" />
    <div className="space-y-6">
      ${CONCEPT.map((line,i)=>html`<${motion.p} key=${i}
        className=${i===0?"font-title italic text-bordeaux":"font-body text-[#3f382f]"}
        style=${{fontSize:i===0?"clamp(20px,3vw,26px)":"clamp(16px,2.2vw,19px)",lineHeight:2.4}}
        initial=${{opacity:0,y:14}} whileInView=${{opacity:1,y:0}} viewport=${{once:true,amount:.5}}
        transition=${{duration:1.1,delay:i*0.12,ease:"easeOut"}}>${line}<//>`)}
    </div>
    <div className="flex gap-6 justify-center mt-12">
      ${["note","Instagram"].map(s=>html`<a key=${s} href="#" target="_blank" rel="noopener"
        className="font-logo tracking-[.16em] text-gold border border-gold px-7 py-3 rounded-[2px] text-sm transition-colors hover:bg-gold hover:text-ivory">${s}</a>`)}
    </div>
    <p className="text-xs text-[#7a6f5f] mt-6">※ note・Instagram のURLを差し替えてください</p>
  </section>`;
}
function Contact(){
  const fields=[["件名","subject","text",true],["返信用アドレス","email","email",false]];
  return html`<section className="max-w-xl mx-auto px-6 pt-20 pb-28">
    <${Head} fr="CONTACT" title="Contact" sub="夜のあいだに、お便りを。" />
    <form className="space-y-6" onSubmit=${e=>e.preventDefault()}>
      ${fields.map(f=>html`<div key=${f[1]}>
        <label className="block font-title text-bordeaux mb-2 text-base">${f[0]} ${f[3]?html`<span className="text-gold text-xs">必須</span>`:null}</label>
        <input type=${f[2]} name=${f[1]} required=${f[3]}
          className="w-full px-4 py-3.5 rounded-[2px] border border-gold/50 bg-white/50 text-[15px] text-midnight outline-none focus:border-gold focus:ring-2 focus:ring-gold/20" />
      </div>`)}
      <div>
        <label className="block font-title text-bordeaux mb-2 text-base">用件 <span className="text-gold text-xs">必須</span></label>
        <textarea name="message" rows="6" required
          className="w-full px-4 py-3.5 rounded-[2px] border border-gold/50 bg-white/50 text-[15px] text-midnight outline-none focus:border-gold focus:ring-2 focus:ring-gold/20"></textarea>
      </div>
      <${GoldButton} solid>送る<//>
      <p className="text-xs text-[#7a6f5f] text-center">※ 送信を実際に届くようにするには、後で送信先の設定が必要です。</p>
    </form>
  </section>`;
}
function Legal({which,go}){
  const d=LEGAL[which]; if(!d) return null;
  return html`<section className="max-w-3xl mx-auto px-6 pt-20 pb-28">
    <${Head} fr=${d.fr} title=${d.title} />
    <p className="text-xs text-[#a0704a] mb-10 text-center">※ これはサンプルです。公開前に内容をご確認・修正し、必要に応じて専門家にご確認ください。</p>
    <div className="space-y-7 font-body text-[#3f382f] text-[15px] leading-loose">
      ${d.sections.map((s,i)=>html`<div key=${i}>
        ${s.h?html`<h3 className="font-title text-bordeaux text-xl mb-2">${s.h}</h3>`:null}
        ${s.body.map((line,j)=>html`<p key=${j} className="whitespace-pre-line">${line}</p>`)}
      </div>`)}
    </div>
    <div className="mt-14 text-center"><button onClick=${()=>go("store")} className="font-title italic text-gold hover:text-bordeaux">‹ Online store へ戻る</button></div>
  </section>`;
}
function Footer({go}){
  const links=[["terms","利用規約"],["privacy","プライバシーポリシー"],["tokusho","特定商取引法に基づく表記"]];
  return html`<footer className="relative z-[5] bg-midnight text-ivory text-center px-6 pt-14 pb-11">
    <div className="flex gap-5 justify-center flex-wrap text-[13px] font-title mb-6 opacity-80">
      ${links.map((l,i)=>html`<${F} key=${l[0]}>
        ${i>0?html`<span className="opacity-40">｜</span>`:null}
        <button onClick=${()=>go(l[0])} className="hover:text-goldlight transition-colors">${l[1]}</button>
      <//>`)}
    </div>
    <p className="font-logo tracking-[.16em] text-goldlight text-[13px] mb-3">© Pâtisserie Arômélancolie</p>
    <p className="font-title italic text-ivory/90">À bientôt, lorsque la nuit reviendra.
      <span className="block not-italic font-body text-xs opacity-60 mt-1.5">また夜になったら、お会いしましょう。</span>
    </p>
  </footer>`;
}
function Store(){
  const [page,setPage]=useState("store"); const [idx,setIdx]=useState(0);
  const go=useCallback((p)=>{ setPage(p); window.scrollTo(0,0); },[]);
  const open=useCallback((i)=>{ setIdx(i); setPage("detail"); window.scrollTo(0,0); },[]);
  let body=null;
  if(page==="store") body=html`<${ProductGrid} open=${open} />`;
  else if(page==="detail") body=html`<${ProductDetail} p=${PRODUCTS[idx]} back=${()=>go("store")} />`;
  else if(page==="access") body=html`<${Access} />`;
  else if(page==="concept") body=html`<${Concept} />`;
  else if(page==="contact") body=html`<${Contact} />`;
  else if(page==="terms"||page==="privacy"||page==="tokusho") body=html`<${Legal} which=${page} go=${go} />`;
  return html`<${motion.div} className="relative z-[5] min-h-screen bg-ivory text-midnight"
      initial=${{opacity:0}} animate=${{opacity:1}} transition=${{duration:1.4,delay:.3}}>
    <!-- 店内のほのかな暖色の空気感 -->
    <div className="fixed inset-0 pointer-events-none" style=${{zIndex:0,background:"radial-gradient(120% 60% at 50% 0%,rgba(176,141,87,.07),transparent 55%),radial-gradient(120% 90% at 50% 100%,rgba(71,8,30,.05),transparent 60%)"}}></div>
    <${Nav} page=${page==="detail"?"store":page} go=${go} />
    <div style=${{perspective:1600}}>
      <${AnimatePresence} mode="wait">
        <${motion.main} key=${page} initial=${{opacity:0,rotateY:14,x:40}} animate=${{opacity:1,rotateY:0,x:0}}
          exit=${{opacity:0,x:-30}} transition=${{duration:.8,ease:[.22,.61,.36,1]}} style=${{transformOrigin:"left center"}}>
          ${body}
        <//>
      <//>
    </div>
    <${Footer} go=${go} />
  <//>`;
}
function Nav({page,go}){
  return html`<nav className="sticky top-0 z-20 backdrop-blur border-b border-gold/30" style=${{background:"rgba(237,228,202,.9)"}}>
    <div className="max-w-5xl mx-auto px-5 sm:px-6 py-3 sm:py-4 flex flex-col sm:flex-row flex-wrap items-center sm:justify-between gap-x-3 gap-y-2">
      <button onClick=${()=>go("store")} className="font-logo tracking-[.14em] sm:tracking-[.16em] text-bordeaux text-base sm:text-lg">Arômélancolie</button>
      <div className="flex flex-wrap justify-center gap-x-5 gap-y-1 sm:gap-6">
        ${NAV.map(n=>html`<button key=${n[0]} onClick=${()=>go(n[0])}
          className=${"font-title text-sm sm:text-base tracking-wide transition-colors "+(page===n[0]?"text-bordeaux":"text-midnight/80 hover:text-bordeaux")}>${n[1]}</button>`)}
      </div>
    </div>
  </nav>`;
}
function MuteButton({muted,setMuted,entered}){
  return html`<button title=${muted?"音：オフ":"音：オン"}
    onClick=${()=>{ const m=!muted; setMuted(m); isMuted.v=m; if(m) stopAmbient(); else { ctx(); if(entered) startAmbient(); } }}
    className=${"fixed bottom-5 right-5 z-[950] w-11 h-11 rounded-full flex items-center justify-center border transition-all "+(entered?"border-gold/70 text-bordeaux":"border-gold/60 text-goldlight")}
    style=${{background:entered?"rgba(237,228,202,.6)":"rgba(16,26,43,.5)",backdropFilter:"blur(4px)"}}>${muted?"✕":"♪"}</button>`;
}

/* ===== App ===== */
function App(){
  const [phase,setPhase]=useState("cover");
  const [entering,setEntering]=useState(false);
  const [muted,setMuted]=useState(false);
  const bellRung=useRef(false);
  useEffect(()=>{ if(!window.matchMedia("(pointer:coarse)").matches) document.body.classList.add("has-star"); },[]);
  useEffect(()=>{ const first=()=>{ if(!bellRung.current&&!isMuted.v){ bellRung.current=true; ctx(); setTimeout(playBell,120); }
      window.removeEventListener("pointerdown",first); window.removeEventListener("keydown",first); };
    window.addEventListener("pointerdown",first); window.addEventListener("keydown",first);
    return ()=>{ window.removeEventListener("pointerdown",first); window.removeEventListener("keydown",first); }; },[]);
  const enter=()=>{ playEnter(); setEntering(true);
    setTimeout(()=>{ setPhase("store"); setEntering(false); if(!isMuted.v) startAmbient(); window.scrollTo(0,0); },2450); };
  return html`<${F}>
    <${StarCursor} />
    <${NightSky} dim=${phase==="store"} />
    <${MuteButton} muted=${muted} setMuted=${setMuted} entered=${phase==="store"} />
    <${AnimatePresence}>${phase==="cover"?html`<${Cover} key="cover" onEnter=${enter} />`:null}<//>
    <${AnimatePresence}>${entering?html`<${motion.div} key="enter" className="fixed inset-0 z-[90] overflow-hidden pointer-events-none" initial=${{opacity:1}} exit=${{opacity:0}} transition=${{duration:.5}}>
      <!-- 扉へ吸い込まれるようにズーム（ゆっくり→加速で自然に） -->
      <${motion.img} src="assets/TOP2.jpeg" className="absolute inset-0 w-full h-full object-cover" style=${{transformOrigin:"58% 82%",willChange:"transform"}}
        initial=${{scale:1}} animate=${{scale:5.5}} transition=${{duration:2.3,ease:[.52,0,.82,.42]}} />
      <!-- トンネル状のビネット（扉に視線を集め、拡大した端のアラを隠す） -->
      <${motion.div} className="absolute inset-0" style=${{background:"radial-gradient(circle at 58% 82%, transparent 18%, rgba(6,8,16,.9) 62%)"}}
        initial=${{opacity:0}} animate=${{opacity:1}} transition=${{duration:1.5,ease:"easeIn"}} />
      <!-- 扉から光があふれて包み込む -->
      <${motion.div} className="absolute rounded-full" style=${{left:"58%",top:"82%",transform:"translate(-50%,-50%)",width:"22vmin",height:"22vmin",background:"radial-gradient(circle,#fff7e6 0%,#f6e9c8 40%,rgba(237,228,202,.7) 64%,transparent 82%)"}}
        initial=${{opacity:0,scale:.14}} animate=${{opacity:1,scale:22}} transition=${{duration:1.7,delay:.6,ease:[.45,0,.35,1]}} />
    <//>`:null}<//>
    ${phase==="store"?html`<${Store} />`:null}
  <//>`;
}

createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
